name: 同步课程目录与已有课程选择

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-course-catalog-main
  cancel-in-progress: false

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 更新课程导航和已有课程下拉选项
        run: python3 scripts/sync_course_catalog.py

      - name: 创建或更新课程索引 PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/sync-course-catalog
          add-paths: |
            README.md
            .github/ISSUE_TEMPLATE/supplement-course.yml
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: 自动更新课程导航与选项"
          title: "docs: 自动同步课程导航与已有课程选项"
          body: |
            自动扫描课程目录，更新：
            - 仓库首页 README.md 的课程分类导航
            - 补充课程表单的已有课程下拉选项

            请审核后合并。
