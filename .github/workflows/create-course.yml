name: 自动提交课程 PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-course:
    if: startsWith(github.event.issue.title, '[新增课程]') || startsWith(github.event.issue.title, '[补充课程]') || startsWith(github.event.issue.title, '[课程资料]')
    runs-on: ubuntu-latest

    steps:
      - name: 新增课程或补充资料并创建 PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const body = issue.body || '';
            const comment = async message => github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body: message
            });

            // 从 Issue Form 生成的 Markdown 中读取字段
            const fields = {};
            for (const block of body.split(/^###\s+/m).slice(1)) {
              const pos = block.indexOf('\n');
              if (pos < 0) continue;
              const key = block.slice(0, pos).trim();
              if (!(key in fields)) fields[key] = block.slice(pos + 1).trim();
            }
            // 两张表单使用不同的课程字段；旧版表单仍然兼容。
            const isSupplementForm = issue.title.startsWith('[补充课程]');
            const name = (isSupplementForm
              ? (fields['选择已有课程'] || '')
              : (fields['课程名称'] || '')
            ).normalize('NFC').trim();
            const category = (fields['课程分类（新增课程必填）'] || fields['课程分类'] || '').trim();
            let rawKeywords = (fields['关键词（新增课程选填）'] || fields['关键词（选填）'] || '').trim();
            if (/^_?No response_?$/i.test(rawKeywords)) rawKeywords = '';
            const keywords = rawKeywords
              ? rawKeywords.split(/[、，,]/).map(s => s.trim()).filter(Boolean)
              : [];
            const cleanOptional = value => {
              const text = (value || '').trim();
              return /^_?No response_?$/i.test(text) ? '' : text;
            };
            const notes = cleanOptional(fields['课程说明或修读建议（选填）']);
            const rawNetdisk = cleanOptional(fields['网盘资料（选填）']);
            const safeLabel = s => s.replace(/[\[\]\\\r\n<>]/g, ' ').trim().slice(0, 100);
            const netdisk = [];
            const netdiskUrls = new Set();
            for (const line of rawNetdisk.split(/\r?\n/).map(s => s.trim()).filter(Boolean)) {
              const parts = line.split('|').map(s => s.trim());
              if (parts.length < 2 || parts.length > 3 || !parts[0] || !parts[1]) {
                await comment('网盘资料请按“资料名称 | 分享链接 | 提取码（可不填）”填写，每行一条。');
                return;
              }
              let url;
              try {
                url = new URL(parts[1]);
              } catch (_) {
                await comment(`网盘资料「${safeLabel(parts[0])}」的链接无效。`);
                return;
              }
              if (url.protocol !== 'https:' || !url.hostname || url.username || url.password
                  || parts[1].length > 1500 || parts[0].length > 100) {
                await comment(`网盘资料「${safeLabel(parts[0])}」请填写有效的 HTTPS 分享链接。`);
                return;
              }
              if (parts[2] && (parts[2].length > 40 || /[\[\]\r\n<>]/.test(parts[2]))) {
                await comment(`网盘资料「${safeLabel(parts[0])}」的提取码格式不正确。`);
                return;
              }
              if (netdiskUrls.has(url.href)) continue;
              netdiskUrls.add(url.href);
              netdisk.push({
                label: safeLabel(parts[0]),
                url: url.href.replace(/\(/g, '%28').replace(/\)/g, '%29'),
                passcode: parts[2] || ''
              });
            }
            if (netdisk.length > 15 || notes.length > 2000) {
              await comment('网盘资料最多 15 条，课程说明最多 2000 字。');
              return;
            }
            const categories = [
              '公共基础课', '专业基础课', '专业核心课',
              '通识选修课', '实验实践课', '其他'
            ];
            const validText = /^[\p{L}\p{N} _（）()·.+#-]+$/u;

            if (!name || [...name].length > 60 || !validText.test(name)
                || name.startsWith('.') || name.endsWith('.')) {
              await comment('课程名称无效，请使用 1～60 个字符，不能包含斜杠或特殊路径字符。');
              return;
            }
            if (keywords.length > 10 || keywords.some(k =>
                [...k].length > 30 || !validText.test(k))) {
              await comment('关键词最多 10 个，每个最多 30 字，请用逗号分隔。');
              return;
            }

            // 只接受 GitHub 自己托管的 Issue 附件，不下载外部链接
            const uploadField = fields['上传课程资料（选填）'] || '';
            const attachments = [];
            const seen = new Set();
            const linkRE = /!?\[([^\]\r\n]{1,180})\]\((https:\/\/github\.com\/user-attachments\/(?:assets|files)\/[^\s)]+)\)/g;
            for (const match of uploadField.matchAll(linkRE)) {
              const url = match[2];
              if (!seen.has(url)) {
                attachments.push({ label: match[1], url });
                seen.add(url);
              }
            }
            const plainRE = /https:\/\/github\.com\/user-attachments\/(?:assets|files)\/[^\s)>]+/g;
            for (const match of uploadField.matchAll(plainRE)) {
              const url = match[0];
              if (!seen.has(url)) {
                attachments.push({ label: '', url });
                seen.add(url);
              }
            }

            // 自动区分新课程和已有课程
            let existingCourse = false;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: name, ref: 'main'
              });
              if (!Array.isArray(data) && data.type !== 'dir') {
                await comment(`「${name}」与现有文件同名，无法建立课程目录。`);
                return;
              }
              existingCourse = true;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (isSupplementForm && !existingCourse) {
              await comment(`没有找到课程「${name}」，请从最新课程列表重新选择，或使用新增课程表单。`);
              return;
            }
            if (!existingCourse && !categories.includes(category)) {
              await comment('新增课程时请选择课程分类，并重新提交表单。');
              return;
            }
            if (existingCourse && attachments.length === 0 && netdisk.length === 0 && !notes) {
              const form = `https://github.com/${owner}/${repo}/issues/new?template=supplement-course.yml&existing_course=${encodeURIComponent(name)}`;
              await comment(`课程「${name}」已存在。你可以[补充该课程资料](${form})。`);
              return;
            }

            // 附件下载：限制 GitHub 域名、大小、数量；不解压、不执行
            const MAX_FILE = 25 * 1000 * 1000;   // 官方文档/压缩包/文本上限：25 MB
            const MAX_IMAGE = 10 * 1000 * 1000; // 官方图片上限：10 MB
            const MAX_TOTAL = 50 * 1024 * 1024;
            const ALLOWED = new Set([
              '.pdf', '.docx', '.pptx', '.xlsx', '.zip',
              '.png', '.jpg', '.jpeg', '.webp', '.txt'
            ]);
            const isGithubHost = host =>
              host === 'github.com' || host.endsWith('.githubusercontent.com');
            async function download(url) {
              let next = url;
              for (let i = 0; i < 6; i++) {
                const parsed = new URL(next);
                if (parsed.protocol !== 'https:' || !isGithubHost(parsed.hostname)) {
                  throw new Error('重定向到了非 GitHub 域名');
                }
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 30000);
                let res;
                try {
                  res = await fetch(next, {
                    redirect: 'manual', signal: controller.signal
                  });
                  if ([301, 302, 303, 307, 308].includes(res.status)) {
                    const location = res.headers.get('location');
                    if (!location) throw new Error('重定向缺少 Location');
                    next = new URL(location, next).href;
                    continue;
                  }
                  if (!res.ok) throw new Error(`HTTP ${res.status}`);
                  const type = res.headers.get('content-type') || '';
                  if (type.toLowerCase().includes('text/html')) {
                    throw new Error('返回了网页，而不是文件');
                  }
                  const declared = Number(res.headers.get('content-length') || 0);
                  if (declared > MAX_FILE) throw new Error('文件超过 25MB');
                  const chunks = [];
                  let size = 0;
                  for await (const chunk of res.body) {
                    size += chunk.length;
                    if (size > MAX_FILE) throw new Error('文件超过 25MB');
                    chunks.push(Buffer.from(chunk));
                  }
                  if (!size) throw new Error('下载到空文件');
                  return { bytes: Buffer.concat(chunks), type };
                } finally {
                  clearTimeout(timer);
                }
              }
              throw new Error('附件重定向次数过多');
            }

            function filenameOf(attachment, type, index) {
              let name = attachment.label.trim();
              try {
                const part = new URL(attachment.url).pathname.split('/').pop();
                if (!/\.[A-Za-z0-9]{2,5}$/.test(name)) {
                  name = decodeURIComponent(part || '');
                }
              } catch (_) { /* 使用原始标题 */ }
              if (!/\.[A-Za-z0-9]{2,5}$/.test(name)) {
                const mime = type.split(';')[0].toLowerCase();
                const ext = {
                  'image/png': '.png', 'image/jpeg': '.jpg',
                  'image/webp': '.webp', 'application/pdf': '.pdf',
                  'text/plain': '.txt'
                }[mime];
                name = ext ? `附件-${index}${ext}` : '';
              }
              if (!name || name.length > 100 || /[\/\\<>:"|?*\x00-\x1F]/.test(name)
                  || name === '.' || name === '..') return null;
              const ext = name.toLowerCase().match(/\.[^.]+$/)?.[0];
              return ALLOWED.has(ext) ? name : null;
            }

            const imported = [];
            const pending = [];
            const usedNames = new Set();
            let total = 0;

            // 已有课程遇到同名文件时创建新文件，不覆盖原资料
            async function pickFilename(filename) {
              const dot = filename.lastIndexOf('.');
              const stem = filename.slice(0, dot);
              const ext = filename.slice(dot);
              for (let n = 1; n <= 99; n++) {
                const candidate = n === 1 ? filename : `${stem}-${n}${ext}`;
                if (usedNames.has(candidate)) continue;
                if (existingCourse) {
                  try {
                    await github.rest.repos.getContent({
                      owner, repo, path: `${name}/资料/${candidate}`, ref: 'main'
                    });
                    continue;
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
                usedNames.add(candidate);
                return candidate;
              }
              throw new Error('同名文件过多');
            }
            if (attachments.length > 0) {
              for (const [idx, file] of attachments.entries()) {
                if (idx >= 5) {
                  pending.push({ ...file, reason: '超过最多 5 个附件的自动导入限制' });
                  continue;
                }
                try {
                  const data = await download(file.url);
                  if (total + data.bytes.length > MAX_TOTAL) {
                    throw new Error('本次附件总大小超过 50MB');
                  }
                  let filename = filenameOf(file, data.type, idx + 1);
                  if (!filename) throw new Error('附件类型或文件名不支持');
                  if (/\.(png|jpe?g|webp)$/i.test(filename) && data.bytes.length > MAX_IMAGE) {
                    throw new Error('图片超过 10MB');
                  }
                  filename = await pickFilename(filename);
                  total += data.bytes.length;
                  imported.push({ filename, bytes: data.bytes });
                } catch (error) {
                  pending.push({ ...file, reason: error.message });
                }
              }
            }

            // 已有课程没有成功导入的文件，就不生成空 PR
            if (existingCourse && imported.length === 0 && netdisk.length === 0 && !notes) {
              const reasons = pending.map(x => `- ${x.label || '附件'}：${x.reason}`);
              await comment(['暂无可提交的新内容，请检查附件后重试。', ...reasons].join('\n'));
              return;
            }

            const links = imported.map(f =>
              `- [${safeLabel(f.filename)}](./资料/${encodeURIComponent(f.filename)})`
            );
            const cloudLinks = netdisk.map(f =>
              `- [${f.label}](${f.url})${f.passcode ? `（提取码：${safeLabel(f.passcode)}）` : ''}`
            );
            // 保留其他章节，将新条目放进对应章节；没有章节则新建
            function insertSection(text, section, rows) {
              if (!rows.length) return text;
              const heading = section === '课程资料'
                ? /^##[ \t]*(?:课程资料|资料目录|学习资料|资料列表|资源目录)[ \t]*$/m
                : /^#{2,3}[ \t]*(?:网盘资料|大文件资料(?:（网盘）)?)[ \t]*$/m;
              const block = rows.join('\n');
              if (heading.test(text)) {
                return text.replace(heading, match => `${match}\n\n${block}`);
              }
              return `${text.trimEnd()}\n\n## ${section}\n\n${block}\n`;
            }

            let readme;
            let readmeSha;
            if (existingCourse) {
              // 保留课程原有介绍和元数据，只插入本次新增的资料链接
              let original = '';
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: `${name}/README.md`, ref: 'main'
                });
                if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                  throw new Error('无法读取现有课程 README');
                }
                readmeSha = data.sha;
                original = Buffer.from(data.content.replace(/\n/g, ''), 'base64').toString('utf8');
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              if (!original) original = `# ${name}\n`;

              // 已有课程保留原内容，追加本次资料和说明
              if (links.length) {
                original = original.replace(/^暂无(?:仓库内)?资料，欢迎继续贡献。\s*$/m, '');
              }
              readme = insertSection(original, '课程资料', links);
              const freshLinks = netdisk.filter(f => !original.includes(f.url)).map(f =>
                `- [${f.label}](${f.url})${f.passcode ? `（提取码：${safeLabel(f.passcode)}）` : ''}`
              );
              readme = insertSection(readme, '网盘资料', freshLinks);
              if (notes && !original.includes(notes)) {
                readme = `${readme.trimEnd()}\n\n### 补充说明（@${issue.user.login}）\n\n${notes}\n`;
              }
              if (readme === original) {
                await comment('这些资料已收录，未检测到新的内容。');
                return;
              }
            } else {
              readme = [
                '<!-- COURSE_META_START',
                `分类：${category}`,
                `关键词：${keywords.join('、')}`,
                'COURSE_META_END -->',
                '',
                `# ${name}`,
                '',
                `> **课程分类**：${category}  `,
                `> **关键词**：${keywords.join(' · ') || '暂无'}`,
                '',
                '## 课程简介',
                '',
                notes || '欢迎补充课程简介和学习建议。',
                '',
                '## 课程资料',
                '',
                ...(links.length ? links : ['暂无资料，欢迎继续贡献。']),
                '',
                ...(cloudLinks.length ? ['## 网盘资料', '', ...cloudLinks, ''] : []),
                '## 修读建议',
                '',
                '欢迎补充修读体验和注意事项。',
                ''
              ].join('\n');
            }

            // 新建课程自动加入补充表单入口，已有课程的旧链接也会升级
            function addCourseShortcut(text) {
              const url = `https://github.com/${owner}/${repo}/issues/new?template=supplement-course.yml&existing_course=${encodeURIComponent(name)}`;
              const link = `**[➕ 补充本课程资料（免 Fork）](${url})**`;
              const old = /^\*\*\[➕ 补充本课程资料（免 Fork）\]\(https:\/\/github\.com\/Jinyong-Li\/CSU-Courses\/issues\/new\?template=(?:add-course|supplement-course)\.yml&(?:course_name|existing_course)=[^\n)]+\)\*\*$/gm;
              if (old.test(text)) return text.replace(old, link);
              if (text.includes('issues/new?template=supplement-course.yml&existing_course=')) return text;
              if (/^# [^\n]+/m.test(text)) {
                return text.replace(/^# [^\n]+/m, heading => `${heading}\n\n${link}`);
              }
              return `${link}\n\n${text}`;
            }
            readme = addCourseShortcut(readme);

            // 每个 Issue 使用独立分支
            const branch = `course-submission/issue-${issue.number}`;
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: main.commit.sha
            });

            // 将提交 Issue 的同学设为 Git 作者
            const contributor = issue.user;

            const author = {
              name: contributor.login,
              email: `${contributor.id}+${contributor.login}@users.noreply.github.com`
            };

            // Bot 负责提交，但 Git 作者是贡献者本人
            const write = async (path, bytes, message, sha) => {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                branch,
                path,
                message,
                content: bytes.toString('base64'),
                author,
                ...(sha ? { sha } : {})
              });
            };

            await write(`${name}/README.md`, Buffer.from(readme, 'utf8'),
              `docs: ${existingCourse ? '补充' : '新增'}课程 ${name} (#${issue.number})`, readmeSha);
            for (const f of imported) {
              await write(`${name}/资料/${f.filename}`, f.bytes,
                `docs: 添加课程资料 ${f.filename}`);
            }

            const incomplete = pending.length > 0;
            const reviewNotes = incomplete ? [
              '',
              '### 需要补充的资料',
              '',
              ...pending.map((file, i) =>
                `- [ ] ${safeLabel(file.label) || `附件 ${i + 1}`}：${file.reason}`
              ),
              '',
              `请查看申请 Issue #${issue.number} 中的附件，补齐文件后标记为 Ready for review。`
            ] : [];

            const { data: pr } = await github.rest.pulls.create({
              owner, repo, head: branch, base: 'main',
              draft: incomplete,
              title: `${existingCourse ? '补充课程资料' : '新增课程'}：${name}`,
              body: [
                `来自课程申请 #${issue.number}`,
                '',
                `- 类型：${existingCourse ? '补充资料' : '新增课程'}`,
                ...(!existingCourse ? [
                  `- 分类：${category}`,
                  `- 关键词：${keywords.join('、') || '无'}`
                ] : []),
                `- 已成功导入：${imported.length} 个文件`,
                `- 网盘资料：${netdisk.length} 条`,
                `- 课程说明：${notes ? '有' : '无'}`,
                `- 待人工处理：${pending.length} 个文件`,
                ...reviewNotes,
                '',
                '请审核课程和资料。',
                '',
                `Closes #${issue.number}`
              ].join('\n')
            });
            const status = incomplete
              ? '有文件需要补充，已创建草稿 PR。'
              : '可直接审核。';
            await comment([
              `课程 PR 已创建：${pr.html_url}`,
              '',
              `已添加 ${imported.length} 个文件、${netdisk.length} 条网盘资料；待补充 ${pending.length} 个附件。`,
              status,
              ...(incomplete ? [`详情请查看 PR 中的待处理清单。`] : [])
            ].join('\n'));
            core.info(`课程 PR：${pr.html_url}`);
