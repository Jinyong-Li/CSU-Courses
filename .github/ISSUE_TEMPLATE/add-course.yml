name: 新增课程
description: 新建课程，也可以同时上传资料
title: "[新增课程] "

body:
  - type: markdown
    attributes:
      value: |
        欢迎分享课程资料！填写下面的信息，提交后会自动创建 PR，等待审核。

  - type: input
    id: course_name
    attributes:
      label: 课程名称
      placeholder: 例如：高等数学
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 课程分类
      options:
        - 公共基础课
        - 专业基础课
        - 专业核心课
        - 通识选修课
        - 实验实践课
        - 其他
    validations:
      required: true

  - type: input
    id: keywords
    attributes:
      label: 关键词（选填）
      placeholder: 例如：数学、微积分、期末复习
    validations:
      required: false

  - type: dropdown
    id: submission_mode
    attributes:
      label: 提交方式
      options:
        - 仅创建课程目录
        - 创建课程并上传资料
    validations:
      required: true

  - type: upload
    id: course_files
    attributes:
      label: 上传课程资料（选填）
      description: 可以选择或拖入文件；没有资料就留空。
    validations:
      required: false
      accept: ".pdf,.docx,.pptx,.xlsx,.zip,.png,.jpg,.jpeg,.webp,.txt"
