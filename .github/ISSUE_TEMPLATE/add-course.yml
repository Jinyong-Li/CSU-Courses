name: 新增课程
description: 创建新课程，可同时上传资料或分享网盘链接
title: "[新增课程] "

body:
  - type: markdown
    attributes:
      value: |
        填写课程信息并提交，机器人会自动创建 PR，等待维护者审核。
        如果填写的课程已经存在，上传的资料也会自动转为补充该课程。

  - type: input
    id: course_name
    attributes:
      label: 课程名称
      placeholder: 例如：高等数学
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 课程分类
      options:
        - 公共基础课
        - 专业基础课
        - 专业核心课
        - 通识选修课
        - 实验实践课
        - 其他
    validations:
      required: true

  - type: input
    id: keywords
    attributes:
      label: 关键词（选填）
      placeholder: 例如：数学、微积分、复习
    validations:
      required: false

  - type: input
    id: target_folder
    attributes:
      label: 资料存放位置（选填）
      description: 例如：课件/第一章。不填写则保存到「资料」文件夹；不同文件夹可以分次提交。
      placeholder: 课件/第一章
    validations:
      required: false

  - type: upload
    id: course_files
    attributes:
      label: 上传课程资料（选填）
      description: 可选择多个文件，支持的格式与大小以 GitHub 上传提示为准
    validations:
      required: false

  - type: textarea
    id: netdisk_links
    attributes:
      label: 网盘资料（选填）
      description: 每行一条：资料名称 | 分享链接 | 提取码（可不填）
      placeholder: |
        期末复习资料 | https://pan.baidu.com/s/xxxx | abcd
        课程视频 | https://pan.quark.cn/s/xxxx
    validations:
      required: false

  - type: textarea
    id: course_notes
    attributes:
      label: 课程说明或修读建议（选填）
      placeholder: 例如：推荐先学习基础章节，再复习往年试题。
    validations:
      required: false
